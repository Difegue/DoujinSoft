<div id="report-modal" class="modal">
    <div class="modal-content">
        <h4 class="black-text">Report this game</h4>
        <p class="black-text">Is this game NSFW and not flagged as such? Let the admins know.</p>
        <div class="input-field">
            <input id="report-reason" type="text" maxlength="200" class="black-text">
            <label for="report-reason">Reason (optional)</label>
        </div>
    </div>
    <div class="modal-footer">
        <a class="modal-close waves-effect btn-flat">Cancel</a>
        <a class="waves-effect btn-flat" onclick="submitReport()">Report</a>
    </div>
</div>
